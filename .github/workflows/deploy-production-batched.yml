name: Déploiement de production groupé

on:
  schedule:
    # Une seule vérification par jour, à 18 h UTC (18 h à Abidjan).
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer un déploiement même sans nouveau commit"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: agricapital-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Déployer le dernier état de main
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dernier état de main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restaurer le dernier commit déjà déployé
        uses: actions/cache/restore@v4
        with:
          path: .deploy-state
          key: agricapital-production-deployed-${{ github.sha }}
          restore-keys: |
            agricapital-production-deployed-

      - name: Vérifier s'il y a de nouvelles modifications
        id: changes
        env:
          FORCE_DEPLOY: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          CURRENT_SHA="$(git rev-parse HEAD)"
          LAST_SHA=""
          if [ -f .deploy-state/last-successful-sha ]; then
            LAST_SHA="$(cat .deploy-state/last-successful-sha)"
          fi

          if [ "$CURRENT_SHA" = "$LAST_SHA" ] && [ "$FORCE_DEPLOY" != "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Aucune nouvelle fusion depuis le dernier déploiement."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Un nouveau commit doit être déployé : $CURRENT_SHA"
          fi

      - name: Vérifier la configuration du Deploy Hook
        if: steps.changes.outputs.deploy == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Le secret GitHub VERCEL_DEPLOY_HOOK_URL n'est pas configuré."
            exit 1
          fi

          case "$VERCEL_DEPLOY_HOOK_URL" in
            https://api.vercel.com/v1/integrations/deploy/*) ;;
            *)
              echo "::error::Le secret ne contient pas une URL Vercel Deploy Hook valide."
              exit 1
              ;;
          esac

      - name: Déclencher le déploiement groupé
        if: steps.changes.outputs.deploy == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --output /tmp/vercel-deploy-response.json \
            --write-out "Réponse Vercel : HTTP %{http_code}\n" \
            "$VERCEL_DEPLOY_HOOK_URL"
          cat /tmp/vercel-deploy-response.json

      - name: Enregistrer le commit déployé
        if: steps.changes.outputs.deploy == 'true'
        run: |
          mkdir -p .deploy-state
          git rev-parse HEAD > .deploy-state/last-successful-sha

      - name: Sauvegarder l'état du déploiement
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/cache/save@v4
        with:
          path: .deploy-state
          key: agricapital-production-deployed-${{ github.sha }}
