name: Security dependency remediation
on:
  push:
    branches: [main, "security/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use compatible npm tooling
        run: npm install --global npm@12
      - name: Generate lockfile and remediate advisories
        run: |
          npm install --package-lock-only
          npm audit fix || { status=$?; echo "::warning::npm audit fix exited $status because remaining advisories require breaking upgrades; continuing with verification and the high/critical security gate."; }
      - name: Capture full audit report
        if: always()
        run: |
          npm audit --json > audit-report.json || true
          node -e "const r=require('./audit-report.json'); console.log('Counts:',JSON.stringify(r.metadata?.vulnerabilities)); for(const [name,v] of Object.entries(r.vulnerabilities||{})) console.log(name,v.severity,'range='+v.range,'fix='+JSON.stringify(v.fixAvailable),'via='+JSON.stringify(v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range})))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-security-audit
          path: audit-report.json
          if-no-files-found: warn
      - name: Verify application
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Require a clean dependency audit
        run: |
          node -e "const r=require('./audit-report.json'); const counts=r.metadata?.vulnerabilities||{}; console.log('Final npm audit:',JSON.stringify(counts)); if((counts.total||0)>0) { console.error('Dependency advisories remain; see npm-security-audit artifact.'); process.exit(1); }"

      - name: Commit the verified lockfile
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "The lockfile is already current."
          else
            git commit -m "fix(deps): refresh audited npm lockfile"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
