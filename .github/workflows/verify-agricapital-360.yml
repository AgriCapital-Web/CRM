name: Vérification et synchronisation du projet

on:
  push:
    branches:
      - main
      - audit-hardening-1.7.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agricapital-360-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Vérifier AgriCapital 360
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer npm 12 requis par le dépôt
        run: |
          npm install --global npm@12.2.0
          node --version
          npm --version
          npm --version | grep -E '^12[.]'

      - name: Vérifier la cohérence du verrouillage npm
        run: npm ci

      - name: Vérifier les types TypeScript
        run: npm run typecheck

      - name: Exécuter les tests
        run: npm run test

      - name: Vérifier la compilation de production
        run: npm run build

      - name: Vérifier le lint
        run: npm run lint
